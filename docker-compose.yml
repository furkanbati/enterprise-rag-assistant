
services:
  api:
    build: .
    container_name: rag-api

    ports:
      - "8000:8000"

    environment:
      HF_HOME: /root/.cache/huggingface

    volumes:
      - .:/app
      - ./data/chroma:/app/data/chroma
      - huggingface_cache:/root/.cache/huggingface

    depends_on:
      - ollama

    restart: unless-stopped

  test:
    build:
      context: .
      dockerfile: Dockerfile.test

    profiles:
      - test

    environment:
      HF_HOME: /root/.cache/huggingface

    volumes:
      - .:/app
      - ./data/chroma:/app/data/chroma
      - huggingface_cache:/root/.cache/huggingface

    depends_on:
      - ollama

  ollama:
    image: ollama/ollama

    volumes:
      - ollama:/root/.ollama

    restart: unless-stopped

volumes:
  ollama:
  huggingface_cache:
