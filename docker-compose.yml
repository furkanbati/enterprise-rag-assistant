
services:
  api:
    build: .
    container_name: rag-api

    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - path: .env
        required: false

    environment:
      HF_HOME: /root/.cache/huggingface

    volumes:
      - .:/app
      - ./data/chroma:/app/data/chroma
      - huggingface_cache:/root/.cache/huggingface
      - easyocr_models:/root/.EasyOCR

    depends_on:
      - ollama

    restart: unless-stopped

  test:
    build:
      context: .
      dockerfile: Dockerfile.test

    profiles:
      - test

    env_file:
      - path: .env
        required: false

    environment:
      HF_HOME: /root/.cache/huggingface

    volumes:
      - .:/app
      - ./data/chroma:/app/data/chroma
      - huggingface_cache:/root/.cache/huggingface

    depends_on:
      - ollama

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui

    container_name: rag-ui

    ports:
      - "127.0.0.1:8501:8501"

    environment:
      API_URL: http://api:8000

    volumes:
      - ./ui:/app/ui

    depends_on:
      - api

    restart: unless-stopped

  ollama:
    image: ollama/ollama

    volumes:
      - ollama:/root/.ollama

    restart: unless-stopped

volumes:
  ollama:
  huggingface_cache:
  easyocr_models:
